name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Тесты ядра (разбор запроса, ники, оценка совпадений)
        run: |
          pip install pytest
          pytest -q
